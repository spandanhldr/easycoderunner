name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) { console.error('Tag must match package.json version'); process.exit(1); }"
      - name: Package
        run: npm run package -- --githubBranch "$GITHUB_REF_NAME" --out easycoderunner.vsix
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" easycoderunner.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" easycoderunner.vsix --verify-tag --generate-notes
          fi
      # Enable only after setting up the Marketplace trusted publishing policy.
      # The repository's locked vsce version lacks --oidc, so use v4 explicitly here.
      - name: Publish to VS Code Marketplace
        if: vars.PUBLISH_MARKETPLACE == 'true'
        run: npm exec --yes --package=@vscode/vsce@4.0.0 -- vsce publish --oidc --packagePath easycoderunner.vsix --skip-duplicate
