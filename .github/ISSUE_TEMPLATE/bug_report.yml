name: Bug report
description: Report an execution, settings, or terminal issue.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a small source example and your Run Config.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, VS Code version, EasyCodeRunner version, terminal, and compiler/runtime version.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Terminal output
      render: text
